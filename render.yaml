# Render Blueprint: New > Blueprint > pick this repo.
# Runs out of the box with in-memory shards/cache/events; short links use Render's RENDER_EXTERNAL_URL.
# To switch on real MySQL shards, Redis and Kafka, add these env vars in the Render dashboard:
#   MYSQL_URL (or SHARD0_URL..SHARD2_URL + DB_USER/DB_PASSWORD), REDIS_URL,
#   KAFKA_BOOTSTRAP_SERVERS, KAFKA_USERNAME, KAFKA_PASSWORD
services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
